name: verify

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/preflight.py
      - run: genvm-lint check contracts/semantic_reconciliation.py --json
      - run: genvm-lint typecheck contracts/semantic_reconciliation.py
        env:
          PYTHONUTF8: "1"
      - run: python -m pytest tests/direct -q
      - run: python scripts/mutation_check.py
